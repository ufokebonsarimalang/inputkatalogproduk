<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Input Data Barang</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: var(--card-bg); width: 100%; max-width: 600px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { color: var(--primary); font-size: 24px; margin-bottom: 5px; }
        .header p { color: #64748b; font-size: 14px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #334155; }
        input[type="text"] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background-color: #fff; color: var(--text); transition: border-color 0.2s; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .spek-section { background: #f1f5f9; padding: 15px; border-radius: 8px; margin: 20px 0; border: 1px dashed #cbd5e1; }
        .spek-section legend { font-size: 13px; font-weight: bold; color: #475569; padding: 0 8px; }
        .btn-submit { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; }
        .btn-submit:hover { background-color: var(--primary-hover); }
        .btn-submit:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .notif { display: none; position: fixed; top: 20px; right: 20px; padding: 15px 20px; border-radius: 6px; color: white; font-weight: 500; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); z-index: 1000; animation: slideIn 0.3s ease-out; }
        .notif.sukses { background-color: #10b981; }
        .notif.gagal { background-color: #ef4444; }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 1s ease-in-out infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .preview-box { background: #fef3c7; border: 1px solid #fcd34d; border-radius: 6px; padding: 10px 14px; font-size: 12.5px; color: #92400e; margin-top: 15px; display: none; line-height: 1.6; }
        .preview-box b { color: #78350f; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Form Input Spesifikasi Barang</h2>
            <p>Huruf besar-kecil otomatis rapi ✨</p>
        </div>

        <form id="formKatalog" onsubmit="kirimData(event)">
            <div class="grid-2">
                <div class="form-group">
                    <label for="brand">Brand</label>
                    <input type="text" id="brand" required placeholder="Contoh: LG, Samsung" oninput="previewFormat()">
                </div>
                <div class="form-group">
                    <label for="tipe">Tipe</label>
                    <input type="text" id="tipe" required placeholder="Contoh: 32LM550BPTA" oninput="previewFormat()">
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="kategori">Kategori</label>
                    <input type="text" id="kategori" required placeholder="Contoh: Elektronik" oninput="previewFormat()">
                </div>
                <div class="form-group">
                    <label for="subKategori">Subkategori</label>
                    <input type="text" id="subKategori" placeholder="Contoh: LED TV" oninput="previewFormat()">
                </div>
            </div>

            <fieldset class="spek-section">
                <legend>Fitur & Spesifikasi Utama</legend>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="spek1">Spek 1</label>
                        <input type="text" id="spek1" placeholder="Contoh: Direct Led Panel" oninput="previewFormat()">
                    </div>
                    <div class="form-group">
                        <label for="spek2">Spek 2</label>
                        <input type="text" id="spek2" placeholder="Contoh: HD 720p Resolution" oninput="previewFormat()">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="spek3">Spek 3</label>
                        <input type="text" id="spek3" placeholder="Contoh: Dynamic Color" oninput="previewFormat()">
                    </div>
                    <div class="form-group">
                        <label for="spek4">Spek 4</label>
                        <input type="text" id="spek4" placeholder="Contoh: 60Hz Native Refresh Rate" oninput="previewFormat()">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="spek5">Spek 5</label>
                    <input type="text" id="spek5" placeholder="Contoh: 4 Picture Modes" oninput="previewFormat()">
                </div>
            </fieldset>

            <button type="submit" id="btnSubmit" class="btn-submit">
                <div class="spinner" id="loadingSpinner"></div>
                <span id="btnText">Simpan Data Barang</span>
            </button>

            <!-- Preview hasil format -->
            <div id="previewBox" class="preview-box"></div>
        </form>
    </div>

    <div id="toast" class="notif"></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqnu2yJWk3Bb8JPSVy8ZSZxs5Ae4VGSNpRJl1j3Qgkoj-27FQX_ys4-8qyyyrbXJhQ/exec";

        /* ======================================================
           AUTO-FORMAT HURUF BESAR-KECIL
           ====================================================== */
        
        // Daftar singkatan yang HARUS tetap HURUF BESAR
        const SINGKATAN = [
            "USB", "HDMI", "TV", "AC", "LED", "LCD", "OLED", "QLED", "UHD", "FHD", "HD",
            "MP", "GB", "TB", "MB", "KG", "L", "ML", "W", "V", "HZ", "RPM", "PK", "BTU",
            "HDR", "DTS", "DLNA", "AI", "OS", "PC", "DVD", "CD", "AV", "HDD", "SSD",
            "RAM", "ROM", "CPU", "GPU", "IPS", "TN", "VA", "AMOLED", "IPS", "NFC", "GPS",
            "WIFI", "WI-FI", "LAN", "RJ45", "HDMI", "VGA", "DVI", "PCM", "ABS", "ECA",
            "IP", "IPX", "IP54", "IP68", "RF", "IR", "UV", "DC", "AC", "R32", "R33", "R600A",
            "C", "F", "COOL", "HOT", "SUS", "X-TOR", "PGM", "A+", "A++", "A+++", "XYZ",
            "IG", "DDR", "DDR2", "DDR3", "DDR4", "DDR5", "PCI", "PCIe", "M.2", "NVME",
            "SATA", "UFS", "LPDDR", "LPDDR4", "LPDDR4X", "LPDDR5", "SO-DIMM", "DIMM"
        ];

        // Perbaikan typo umum
        const PERBAIKAN = {
            "ASSISTEN": "Assistant",
            "ASSISTANT": "Assistant",
            "ASSISTAN": "Assistant",
            "BLUETOTH": "Bluetooth",
            "BLUETOOH": "Bluetooth"
        };

        // Singkatan penting yang dipertahankan kapital
        function isSingkatan(kata) {
            const upper = kata.toUpperCase().replace(/[^A-Z0-9]/g, "");
            return SINGKATAN.includes(upper);
        }

        // Format 1 kata
        function formatKata(kata) {
            if (!kata) return "";
            
            const upper = kata.toUpperCase();
            
            // Cek typo
            if (PERBAIKAN[upper]) return PERBAIKAN[upper];
            
            // Cek singkatan
            if (isSingkatan(kata)) return upper;
            
            // Kalau ada angka, format khusus
            if (/\d/.test(kata)) {
                // Contoh: "32inch" → "32Inch", "100liter" → "100Liter", "2tahun" → "2Tahun"
                return kata.replace(/(\d+)([a-z])/gi, (m, num, huruf) => num + huruf.toUpperCase())
                           .replace(/^([a-z])/i, (m) => m.toUpperCase());
            }
            
            // Kata biasa: kapital di awal
            return kata.charAt(0).toUpperCase() + kata.slice(1).toLowerCase();
        }

        // Format seluruh teks
        function autoFormat(teks) {
            if (!teks || teks.trim() === "" || teks === "-") return teks;
            
            // Pisah berdasarkan spasi
            return teks.split(/\s+/).map(kata => {
                // Handle tanda hubung (contoh: "X-TOR" → "X-Tor")
                if (kata.includes("-")) {
                    return kata.split("-").map(formatKata).join("-");
                }
                // Handle tanda baca di akhir (contoh: "USB," → "USB,")
                return formatKata(kata);
            }).join(" ");
        }

        /* ======================================================
           AMBIL NILAI & FORMAT
           ====================================================== */
        function getFormattedValue(elementId) {
            const el = document.getElementById(elementId);
            if (!el) return "-";
            const val = el.value.trim();
            if (val === "") return "-";
            return autoFormat(val);
        }

        /* ======================================================
           PREVIEW FORMAT (Real-time)
           ====================================================== */
        function previewFormat() {
            const box = document.getElementById("previewBox");
            const brand = getFormattedValue("brand");
            const tipe = getFormattedValue("tipe");
            const kategori = getFormattedValue("kategori");
            const subKategori = getFormattedValue("subKategori");
            const spek1 = getFormattedValue("spek1");
            const spek2 = getFormattedValue("spek2");
            const spek3 = getFormattedValue("spek3");
            const spek4 = getFormattedValue("spek4");
            const spek5 = getFormattedValue("spek5");
            
            // Cek apakah ada yang beda dari input asli
            let adaPerubahan = false;
            const cek = (id, formatted) => {
                const asli = document.getElementById(id).value.trim();
                if (asli !== "" && asli !== formatted && formatted !== "-") adaPerubahan = true;
            };
            cek("brand", brand); cek("tipe", tipe); cek("kategori", kategori);
            cek("subKategori", subKategori);
            cek("spek1", spek1); cek("spek2", spek2); cek("spek3", spek3);
            cek("spek4", spek4); cek("spek5", spek5);

            if (!adaPerubahan) {
                box.style.display = "none";
                return;
            }
            
            box.style.display = "block";
            box.innerHTML = `
                <b>📝 Preview (yang akan tersimpan):</b><br>
                <b>Brand:</b> ${brand}<br>
                <b>Tipe:</b> ${tipe}<br>
                <b>Kategori:</b> ${kategori}<br>
                <b>SubKategori:</b> ${subKategori}<br>
                <b>Spek1:</b> ${spek1}<br>
                <b>Spek2:</b> ${spek2}<br>
                <b>Spek3:</b> ${spek3}<br>
                <b>Spek4:</b> ${spek4}<br>
                <b>Spek5:</b> ${spek5}
            `;
        }

        /* ======================================================
           NOTIF & KIRIM DATA
           ====================================================== */
        function tampilkanNotif(pesan, jenis) {
            const toast = document.getElementById('toast');
            toast.innerText = pesan;
            toast.className = `notif ${jenis}`;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }

        function kirimData(e) {
            e.preventDefault();

            const btnSubmit = document.getElementById('btnSubmit');
            const spinner = document.getElementById('loadingSpinner');
            const btnText = document.getElementById('btnText');

            btnSubmit.disabled = true;
            spinner.style.display = 'block';
            btnText.innerText = 'Sedang Menyimpan...';

            // Kirim data yang sudah diformat
            const payload = {
                aksi: "tambah_barang",
                brand: getFormattedValue('brand'),
                tipe: getFormattedValue('tipe'),
                kategori: getFormattedValue('kategori'),
                subKategori: getFormattedValue('subKategori'),
                spek1: getFormattedValue('spek1'),
                spek2: getFormattedValue('spek2'),
                spek3: getFormattedValue('spek3'),
                spek4: getFormattedValue('spek4'),
                spek5: getFormattedValue('spek5')
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "sukses") {
                    tampilkanNotif("Berhasil! Data barang masuk ke sheet KATALOG.", "sukses");
                    document.getElementById('formKatalog').reset();
                    document.getElementById('previewBox').style.display = "none";
                } else {
                    tampilkanNotif("Gagal: " + data.pesan, "gagal");
                }
            })
            .catch(err => {
                tampilkanNotif("Terjadi gangguan jaringan atau URL Script salah.", "gagal");
                console.error(err);
            })
            .finally(() => {
                btnSubmit.disabled = false;
                spinner.style.display = 'none';
                btnText.innerText = 'Simpan Data Barang';
            });
        }
    </script>
</body>
</html>
